<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111a"><link rel="manifest" href="manifest.webmanifest">
<title>LIFEOS</title>
<style>
:root{color-scheme:dark;--bg:#07111a;--card:#10212c;--line:#263b47;--mint:#00d1ad;--muted:#9aabb5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f8fa;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:850px;margin:auto;padding:24px 17px 100px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 28px}.logo{font-size:29px;font-weight:900}.logo span{color:var(--mint)}
h1{font-size:27px;margin:8px 0}h2{font-size:19px}.muted,small{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:29px;font-weight:800}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
button,input,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--mint);color:#052019;font-weight:750}.secondary{background:#1b303c;color:white;border:1px solid var(--line)}
.field{width:100%;padding:12px;background:#091720;border:1px solid var(--line);border-radius:10px;color:white;margin:7px 0 12px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item .grow{flex:1;min-width:0}.check{border:1px solid #7e929d;background:transparent;color:var(--mint);border-radius:50%;width:25px;height:25px}
.progress{height:8px;background:#263b47;border-radius:10px;overflow:hidden}.progress i{display:block;background:var(--mint);height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#09151ef5;border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--muted);font-size:11px;padding:5px 1px}nav button b{display:block;font-size:20px}nav button.active{color:var(--mint)}
.plan{position:relative}.plan.featured{border:1.5px solid var(--mint)}.price{font-size:32px;font-weight:850}.price small{font-size:13px;font-weight:400}.pill{font-size:11px;color:#06221c;background:var(--mint);border-radius:20px;padding:5px 9px;font-weight:800}
ul{padding-left:20px;line-height:1.8;color:#d5e0e5}.disabled{opacity:.55}.note{font-size:12px;line-height:1.5;color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}
</style></head>
<body><main><header><div class="logo">LIFE<span>OS</span></div><span class="pill">BETA</span></header><section id="view"></section></main>
<nav><button data-tab="home" class="active"><b>⌂</b>Inicio</button><button data-tab="tasks"><b>✓</b>Tareas</button><button data-tab="agenda"><b>▦</b>Agenda</button><button data-tab="assistant"><b>✧</b>AI</button><button data-tab="profile"><b>◎</b>Perfil</button></nav>
<script>
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
let tasks=JSON.parse(localStorage.getItem('lo.tasks')||'[]'),events=JSON.parse(localStorage.getItem('lo.events')||'[]'),name=localStorage.getItem('lo.name')||'',tab='home',chat=['Hola. Soy LIFEOS. Puedo ayudarte a organizar tareas y objetivos.'];
const save=()=>{localStorage.setItem('lo.tasks',JSON.stringify(tasks));localStorage.setItem('lo.events',JSON.stringify(events));localStorage.setItem('lo.name',name)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function task(t){return `<div class="item"><button class="check" onclick="toggle('${t.id}')">${t.done?'✓':''}</button><div class="grow"><b>${esc(t.title)}</b><br><small>${esc(t.date)} · ${esc(t.priority)}</small></div><button class="secondary" onclick="del('${t.id}')">×</button></div>`}
function render(){let v=$('#view'),pending=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done),pct=tasks.length?Math.round(done.length/tasks.length*100):0;
if(tab==='home')v.innerHTML=`<p class="muted">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</p><h1>Hola${name?', '+esc(name):''}</h1><p class="muted">Organiza lo que importa.</p><div class="grid"><div class="card"><div class="stat">${pending.length}</div><small>Pendientes</small></div><div class="card"><div class="stat">${done.length}</div><small>Completadas</small></div></div><div class="card"><div class="row between"><b>Progreso</b><b style="color:var(--mint)">${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div></div><h2>Prioridades</h2><div class="card">${pending.slice(0,4).map(task).join('')||'<div class="empty">Todo al día.</div>'}</div><button class="btn" onclick="go('tasks')">＋ Añadir tarea</button>`;
if(tab==='tasks')v.innerHTML=`<div class="row between"><h1>Tareas</h1><button class="btn" onclick="addTask()">＋ Nueva</button></div><div class="card"><h2>Pendientes</h2>${pending.map(task).join('')||'<div class="empty">Sin pendientes.</div>'}</div><div class="card"><h2>Completadas</h2>${done.map(task).join('')||'<div class="empty">Aún no hay tareas completadas.</div>'}</div>`;
if(tab==='agenda')v.innerHTML=`<div class="row between"><h1>Agenda</h1><button class="btn" onclick="addEvent()">＋ Evento</button></div><div class="card">${events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item"><div class="grow"><b>${esc(e.title)}</b><br><small>${esc(e.date)} · ${esc(e.time)}</small></div><button class="secondary" onclick="removeEvent('${e.id}')">×</button></div>`).join('')||'<div class="empty">Tu agenda está vacía.</div>'}</div>`;
if(tab==='assistant')v.innerHTML=`<h1>LIFEOS AI</h1><p class="muted">Asistente local básico; no utiliza un modelo generativo.</p><div class="card">${chat.map((m,i)=>`<p style="padding:10px;border-radius:12px;background:${i%2?'#06483f':'#1b303c'}">${esc(m)}</p>`).join('')}</div><form onsubmit="send(event)" class="row"><input id="msg" class="field" placeholder="Escribe aquí…"><button class="btn">Enviar</button></form>`;
if(tab==='profile')v.innerHTML=`<h1>Tu perfil</h1><div class="card"><label>Nombre</label><input id="name" class="field" value="${esc(name)}" placeholder="Tu nombre"><button class="btn" onclick="saveName()">Guardar</button></div><h2>Elige tu plan</h2><div class="card plan"><div class="row between"><h2>Gratis</h2><span class="pill">ACTUAL</span></div><div class="price">0 €</div><ul><li>Tareas y agenda básicas</li><li>Seguimiento de progreso</li><li>Asistente local básico</li></ul></div><div class="card plan featured"><div class="row between"><h2>LIFEOS Plus</h2><span class="pill">POPULAR</span></div><div class="price">2,99 € <small>/ mes · precio propuesto</small></div><ul><li>Estadísticas semanales y mensuales</li><li>Hábitos y rachas</li><li>Planificación semanal guiada</li><li>Temas y personalización</li></ul><button class="btn secondary" disabled>Próximamente</button></div><div class="card plan"><h2>LIFEOS Pro</h2><div class="price">5,99 € <small>/ mes · precio propuesto</small></div><ul><li>Todo lo incluido en Plus</li><li>Objetivos y proyectos avanzados</li><li>Informes y exportación avanzada</li><li>Plantillas de planificación</li><li>Funciones avanzadas de organización</li></ul><button class="btn secondary" disabled>Próximamente</button></div><p class="note">Los planes y precios son propuestas para validar, no ofertas activas. No hay pagos configurados y ningún botón realiza cobros. Antes de vender habrá que implementar un proveedor de pagos, términos, privacidad y soporte, con la ayuda de un adulto responsable si es necesario.</p>`;
}
function addTask(){let title=prompt('Nombre de la tarea');if(!title?.trim())return;let date=prompt('Fecha AAAA-MM-DD',today())||today();let priority=prompt('Prioridad: Baja, Media o Alta','Media')||'Media';tasks.unshift({id:crypto.randomUUID(),title:title.trim(),date,priority,done:false});save();render()}
function toggle(id){let t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function del(id){tasks=tasks.filter(x=>x.id!==id);save();render()}
function addEvent(){let title=prompt('Nombre del evento');if(!title?.trim())return;let date=prompt('Fecha AAAA-MM-DD',today())||today();let time=prompt('Hora HH:MM','09:00')||'';events.push({id:crypto.randomUUID(),title:title.trim(),date,time});save();render()}
function removeEvent(id){events=events.filter(x=>x.id!==id);save();render()}
function saveName(){name=$('#name').value.trim();save();render()}
function send(e){e.preventDefault();let q=$('#msg').value.trim();if(!q)return;chat.push(q, q.toLowerCase().includes('estudi')?'Divide el temario en bloques de 25 minutos y haz pausas breves.':'Anota lo pendiente, elige tres prioridades y reserva tiempo realista para cada una.');render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));render();
</script></body></html>
